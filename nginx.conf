# Serves the built SPA. Runs behind the existing external Traefik, which
# terminates TLS — this container only speaks plain HTTP on 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik already sets security headers at the edge in most setups, but
    # keep sane defaults here too in case this image is ever exposed directly.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Multi-image uploads (keep >= Caddyfile request_body max_size).
    client_max_body_size 25m;

    # Docker's embedded DNS; lets nginx start even if the API container is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    location /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # API (and local-provider media at /api/v1/media). Traefik/Caddy normally route
    # /api straight to the API; this keeps the web container usable on its own.
    # Uploaded images on R2 are served from R2_PUBLIC_BASE_URL, not through here.
    location /api/ {
        set $vastraa_api http://vastraa-api:4000;
        proxy_pass $vastraa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Hashed build assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deep-link / refresh support for the client-side router.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
