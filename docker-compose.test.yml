# Isolated integration-test database only. It has a dedicated database, user,
# port, and volume; it never references development or production data.
services:
  vastraa-db-test:
    image: postgres:16-alpine
    container_name: vastraa-db-test
    environment:
      POSTGRES_USER: vastraa_test
      POSTGRES_PASSWORD: vastraa_test
      POSTGRES_DB: vastraa_test
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - vastraa_test_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vastraa_test -d vastraa_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vastraa_test_db_data:
